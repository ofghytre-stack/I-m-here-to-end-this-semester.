<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>교수님 정강이 차서 종강하기</title>
<style>
:root{
  --bg:#eef0e6; --panel:#ffffff; --text:#1d2a22; --muted:#6c7a70; --line:#d9ddd1;
  --chip:#e4e8dc; --chip-on:#1d2a22; --chip-on-text:#ffffff;
  --board:#244b3a; --chalk:#f3f1e4; --pen:#d7263d; --ok:#2f8f5b; --btn:#1d2a22; --btn-text:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15211b; --panel:#1f2f27; --text:#eef2e9; --muted:#9fb0a6; --line:#33463c;
    --chip:#2a3b32; --chip-on:#eef2e9; --chip-on-text:#15211b;
    --board:#1b3a2d; --chalk:#f3f1e4; --btn:#eef2e9; --btn-text:#15211b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15211b; --panel:#1f2f27; --text:#eef2e9; --muted:#9fb0a6; --line:#33463c;
  --chip:#2a3b32; --chip-on:#eef2e9; --chip-on-text:#15211b;
  --board:#1b3a2d; --chalk:#f3f1e4; --btn:#eef2e9; --btn-text:#15211b;
}
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; height:100%; position:relative; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none; -webkit-tap-highlight-color:transparent;
}
*{ box-sizing:border-box; }
button{ font:inherit; color:inherit; }
button:focus-visible{ outline:3px solid var(--pen); outline-offset:2px; }

.screen{ position:absolute; inset:0; display:none; }
.screen.on{ display:flex; flex-direction:column; }

/* ---------- 커스터마이징 ---------- */
.screen header{ padding:14px 18px 6px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.screen h1{ margin:0; font-size:19px; letter-spacing:-0.3px; }
.screen h1 small{ display:block; font-size:12px; font-weight:500; color:var(--muted); margin-top:2px; }
.tabs{ display:flex; gap:6px; overflow-x:auto; padding:8px 18px 4px; flex:0 0 auto; touch-action:pan-x; scrollbar-width:none; }
.tabs .chip{ flex:0 0 auto; }
#randomBtn,#subjRandom{ border:1.5px solid var(--line); background:var(--panel); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:700; }
.preview{
  margin:4px 18px 0; height:232px; border-radius:18px; background:var(--board);
  position:relative; overflow:hidden; flex:0 0 auto;
}
.preview canvas{ position:absolute; inset:0; width:100%; height:100%; }
.preview .chalk{
  position:absolute; left:14px; top:12px; color:var(--chalk); opacity:.85; font-size:13px; font-weight:700; letter-spacing:.3px;
}
.preview .chalk span{ display:block; font-size:11px; font-weight:500; opacity:.75; margin-top:3px; }
.panelScroll{ flex:1 1 auto; overflow-y:auto; padding:10px 18px 0; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
.sec{ padding:12px 0 6px; border-bottom:1px solid var(--line); }
.sec:last-child{ border-bottom:0; }
.sec h2{ margin:0 0 8px; font-size:13.5px; font-weight:700; color:var(--muted); }
.sec h2 b{ color:var(--text); font-weight:700; }
.chips{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{
  border:0; background:var(--chip); color:var(--text); border-radius:999px; padding:8px 13px; font-size:13.5px; font-weight:600;
}
.chip.on{ background:var(--chip-on); color:var(--chip-on-text); }
.sw{ width:30px; height:30px; border-radius:50%; border:2px solid var(--panel); box-shadow:0 0 0 1.5px var(--line); padding:0; }
.sw.on{ box-shadow:0 0 0 3px var(--pen); }
.range{ display:flex; align-items:center; gap:10px; }
.range input{ flex:1; accent-color:var(--pen); height:28px; }
.range output{ width:44px; text-align:right; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
#nameIn,#subjIn{
  width:100%; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; font:inherit; font-size:15px;
  background:var(--panel); color:var(--text);
}
.foot{ padding:10px 18px 14px; flex:0 0 auto; }
.big{
  width:100%; border:0; border-radius:16px; padding:16px; font-size:17px; font-weight:800;
  background:var(--btn); color:var(--btn-text);
}
.big.pen{ background:var(--pen); color:#fff; }
.ghost{ width:100%; border:1.5px solid var(--line); background:transparent; border-radius:16px; padding:13px; font-size:15px; font-weight:700; margin-top:8px; }

/* ---------- 게임 ---------- */
#game{ background:#101a15; }
#gwrap{ position:absolute; inset:0; }
#gcanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
#hud{ position:absolute; left:0; right:0; top:0; padding:10px 14px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
.pill{ background:rgba(255,255,255,.92); color:#1d2a22; border-radius:999px; padding:7px 13px; font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; box-shadow:0 2px 8px rgba(0,0,0,.25); }
#near{ background:#d7263d; color:#fff; display:none; }
#hint{ position:absolute; left:0; right:0; top:34%; text-align:center; color:#fff; font-size:15px; font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.6); pointer-events:none; transition:opacity .6s; padding:0 24px; }
#joy{ position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.35); display:none; pointer-events:none; }
#knob{ position:absolute; width:52px; height:52px; left:50%; top:50%; margin:-26px 0 0 -26px; border-radius:50%; background:rgba(255,255,255,.85); box-shadow:0 2px 8px rgba(0,0,0,.3); }
#joy.on{ display:block; }
#ctrls{ position:absolute; right:16px; bottom:22px; display:flex; flex-direction:column; align-items:flex-end; gap:12px; }
.rbtn{
  width:92px; height:92px; border-radius:50%; border:0; font-weight:900; font-size:16px; color:#fff;
  background:#2563eb; box-shadow:0 5px 0 #1e40af, 0 8px 16px rgba(0,0,0,.35); position:relative; overflow:hidden;
}
.rbtn:active{ transform:translateY(3px); box-shadow:0 2px 0 #1e40af; }
.rbtn .meter{ position:absolute; left:0; right:0; bottom:0; height:0%; background:rgba(255,255,255,.3); transition:height .08s; }
.rbtn span{ position:relative; }
#kickBtn{ width:110px; height:110px; background:#d7263d; box-shadow:0 5px 0 #8f1627, 0 8px 18px rgba(0,0,0,.4); font-size:17px; display:none; animation:pop .5s ease-out; }
#kickBtn.on{ display:block; }
@keyframes pop{ from{ transform:scale(.4); } 60%{ transform:scale(1.12); } to{ transform:scale(1); } }

/* ---------- 오버레이(리듬/결과) ---------- */
.overlay{ position:absolute; inset:0; display:none; flex-direction:column; background:var(--bg); }
.overlay.on{ display:flex; }
#rhythm{ background:var(--board); color:var(--chalk); }
#rtitle{ text-align:center; padding:14px 16px 0; font-size:15px; font-weight:700; opacity:.9; }
#rcanvas{ flex:1 1 auto; width:100%; display:block; }
#rtap{ margin:0 18px 18px; width:auto; background:var(--pen); color:#fff; font-size:20px; padding:20px; border-radius:20px; box-shadow:0 6px 0 #8f1627; }
#rtap:active{ transform:translateY(4px); box-shadow:0 2px 0 #8f1627; }
#rhythm.shk{ animation:shk .26s linear; }
@keyframes shk{ 0%,100%{ transform:translate(0,0); } 20%{ transform:translate(calc(var(--amp,4px)*-1),var(--amp,4px)); } 45%{ transform:translate(var(--amp,4px),calc(var(--amp,4px)*-1)); } 70%{ transform:translate(calc(var(--amp,4px)*-1),calc(var(--amp,4px)*-.5)); } }

#result{ align-items:stretch; padding:12px 18px 18px; text-align:center; }
#rescanvas{ width:100%; flex:1 1 auto; min-height:0; display:block; }
#result h1{ margin:4px 0 6px; font-size:24px; letter-spacing:-0.5px; }
#result h1.f{ color:var(--pen); }
#result h1.ok{ color:var(--ok); }
#resSub{ margin:0 0 14px; color:var(--muted); font-size:15px; line-height:1.5; }
#resSub b{ color:var(--text); font-size:30px; display:block; margin:2px 0 4px; font-variant-numeric:tabular-nums; letter-spacing:-0.5px; }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<!-- ===== 1. 교수님 커스터마이징 ===== -->
<section id="custom" class="screen on">
  <header>
    <h1>교수님 만들기<small>정강이를 찰 교수님의 모습을 정하세요</small></h1>
    <button id="randomBtn" type="button">🎲 랜덤</button>
  </header>
  <div class="preview">
    <canvas id="pcanvas"></canvas>
    <div class="chalk">오늘의 강의<span>종강은 없다. 질문 있나요?</span></div>
  </div>
  <div class="panelScroll" id="panel">
    <div class="sec"><h2><b>헤어스타일</b></h2><div class="chips" id="hairChips"></div></div>
    <div class="sec"><h2><b>머리색</b></h2><div class="chips" id="hairColorChips"></div></div>
    <div class="sec"><h2><b>얼굴형</b></h2><div class="chips" id="faceChips"></div></div>
    <div class="sec"><h2><b>주름</b></h2><div class="chips" id="wrinkleChips"></div></div>
    <div class="sec"><h2><b>수염</b></h2><div class="chips" id="beardChips"></div></div>
    <div class="sec"><h2><b>안경</b></h2><div class="chips" id="glassChips"></div></div>
    <div class="sec"><h2><b>안경 색</b></h2><div class="chips" id="glassColorChips"></div></div>
    <div class="sec"><h2><b>키</b></h2>
      <div class="range"><input id="heightIn" type="range" min="0.72" max="1.32" step="0.01"><output id="heightOut"></output></div></div>
    <div class="sec"><h2><b>머리 크기</b> (신체 비율)</h2>
      <div class="range"><input id="headIn" type="range" min="0.75" max="1.5" step="0.01"><output id="headOut"></output></div></div>
    <div class="sec"><h2><b>체형</b></h2><div class="chips" id="bodyChips"></div></div>
    <div class="sec"><h2><b>뱃살</b></h2>
      <div class="range"><input id="bellyIn" type="range" min="0" max="1" step="0.01"><output id="bellyOut"></output></div></div>
    <div class="sec"><h2><b>패션</b></h2><div class="chips" id="outfitChips"></div></div>
    <div class="sec"><h2><b>옷 색</b></h2><div class="chips" id="clothChips"></div></div>
    <div class="sec"><h2><b>교수님 성함</b> (선택)</h2><input id="nameIn" type="text" maxlength="10" placeholder="예: 김종강"></div>
    <div style="height:8px"></div>
  </div>
  <div class="foot"><button class="big" id="enterBtn" type="button">다음: 과목 고르기</button></div>
</section>

<!-- ===== 1.5 과목 선택 ===== -->
<section id="subject" class="screen">
  <header>
    <h1>과목 고르기<small>어느 과목을 종강시킬까요?</small></h1>
    <button id="subjRandom" type="button">🎲 랜덤</button>
  </header>
  <div class="tabs" id="catTabs"></div>
  <div class="panelScroll">
    <div class="sec"><div class="chips" id="subjChips"></div></div>
    <div class="sec"><h2><b>직접 입력</b></h2><input id="subjIn" type="text" maxlength="14" placeholder="예: 전기기계"></div>
    <div style="height:8px"></div>
  </div>
  <div class="foot"><button class="big" id="startBtn" type="button">강의실 입장</button><button class="ghost" id="backBtn" type="button">교수님 수정</button></div>
</section>

<!-- ===== 2. 강의실 ===== -->
<section id="game" class="screen">
  <div id="gwrap"><canvas id="gcanvas"></canvas></div>
  <div id="hud"><div class="pill" id="timer">⏱ 0.00초</div><div class="pill" id="near">정강이 사정권!</div></div>
  <div id="hint">화면을 끌어서 이동하고<br>달리기 버튼을 연타하면 더 빨라집니다</div>
  <div id="joy"><div id="knob"></div></div>
  <div id="ctrls">
    <button class="rbtn" id="kickBtn" type="button"><span>정강이<br>차기</span></button>
    <button class="rbtn" id="runBtn" type="button"><div class="meter" id="meter"></div><span>달리기</span></button>
  </div>
</section>

<!-- ===== 3. 리듬 정강이 차기 ===== -->
<div id="rhythm" class="overlay">
  <div id="rtitle">신발이 초록 원에 겹칠 때 탭하세요. 한 번이라도 놓치면 F입니다.</div>
  <canvas id="rcanvas"></canvas>
  <button class="big" id="rtap" type="button">👟 정강이 차기</button>
</div>

<!-- ===== 4. 결과 ===== -->
<div id="result" class="overlay">
  <canvas id="rescanvas"></canvas>
  <h1 id="resTitle"></h1>
  <p id="resSub"></p>
  <button class="big" id="btnRetry" type="button"></button>
  <button class="ghost" id="btnCustom" type="button">교수님 다시 만들기</button>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= 옵션 ================= */
const HAIR=[['bald','대머리'],['side','옆머리만'],['short','짧은 머리'],['partL','왼쪽 가르마'],['partR','오른쪽 가르마'],['part55','5:5 가르마'],['curly','곱슬'],['bob','단발머리'],['long','긴 머리'],['longnb','긴 머리(앞머리 없음)'],['bun','올림머리'],['afro','폭탄머리']];
const BEARD=[['none','없음'],['mustache','콧수염'],['goatee','턱수염'],['full','콧수염+턱수염']];
const FACE=[['round','둥근형'],['oval','계란형'],['square','각진형'],['long','긴 얼굴'],['heart','역삼각형']];
const FACES={round:{x:1,y:1},oval:{x:0.93,y:1.08},square:{x:1,y:1},long:{x:0.86,y:1.2},heart:{x:1,y:1.02}};
const GLASSC=['#2b2320','#8b5a2b','#c0392b','#2563eb','#d4af37','#16a34a','#7c3aa6','#f5f5f5'];
const HAIRC=['#1c1a1a','#5b3a1e','#a19c96','#e9c75a','#c23b2e','#2f5fc4','#8b3fb5','#f5f2ec'];
const WRINK=['없음','살짝','보통','깊음'];
const GLASSES=[['none','없음'],['round','동그란 안경'],['square','네모 안경'],['sun','선글라스']];
const BODY=[['slim','마른'],['normal','보통'],['chubby','통통'],['big','듬직']];
const OUTFIT=[['suit','정장'],['shirt2','셔츠'],['shirt','셔츠와 넥타이'],['knit','니트'],['labcoat','실험복'],['vest','조끼'],['track','추리닝']];
const CLOTHC=['#2b2f3a','#6b7280','#8b2d2d','#2d6a4f','#1d4ed8','#7c2d8f','#b45309','#e5e7eb'];
let cfg={name:'',hair:'partL',hairColor:HAIRC[0],wrinkle:2,face:'round',beard:'none',glasses:'square',glassColor:GLASSC[0],height:1,headSize:1,body:'normal',belly:0.15,outfit:'suit',cloth:CLOTHC[0]};

/* ================= 그리기 유틸 ================= */
const SKIN='#f2c9a4';
function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); const f=v=>clamp(v+amt,0,255); return `rgb(${f(n>>16&255)},${f(n>>8&255)},${f(n&255)})`; }
function poly(c,pts){ c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.closePath(); }
const KFONT='-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif';

/* ================= 교수님 스프라이트 ================= */
function drawProf(c,x,y,s,cfg,mood){
  mood=mood||'normal';
  const H=110*cfg.height, headD=34*cfg.headSize, r=headD/2;
  const bodyH=Math.max(44,H-headD), legH=bodyH*0.42, torsoH=bodyH-legH;
  const bw={slim:0.78,normal:1,chubby:1.3,big:1.52}[cfg.body];
  const tw=30*bw, col=cfg.cloth, o=cfg.outfit;
  const top={suit:col,shirt:col,shirt2:col,knit:col,labcoat:'#f4f4f1',vest:'#f7f7f5',track:col}[o];
  const pants={suit:shade(col,-18),shirt:'#3b4252',shirt2:'#3b4252',knit:'#4b5563',labcoat:'#3b4252',vest:'#3b4252',track:col}[o];
  const hy=-bodyH-r, ty=-legH-torsoH;
  c.save(); c.translate(x,y); c.scale(s,s);
  c.fillStyle='rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(0,0,tw*0.75,5,0,0,TAU); c.fill();
  const FS=FACES[cfg.face]||FACES.round;
  c.save(); c.translate(0,hy); c.scale(FS.x,FS.y); c.translate(0,-hy); drawHairBack(c,cfg,hy,r); c.restore();
  // 다리
  const lw=Math.max(7,9*bw*0.85), lx=tw*0.28;
  c.fillStyle=pants;
  rr(c,-lx-lw/2,-legH,lw,legH,3); c.fill();
  rr(c,lx-lw/2,-legH,lw,legH,3); c.fill();
  if(o==='track'){ c.fillStyle='#fff'; c.fillRect(-lx-lw/2+1,-legH,2,legH-6); c.fillRect(lx+lw/2-3,-legH,2,legH-6); }
  c.fillStyle='#2a2320'; rr(c,-lx-lw/2-2,-6,lw+5,7,3); c.fill(); rr(c,lx-lw/2-3,-6,lw+5,7,3); c.fill();
  // 몸통
  if(o==='labcoat'){ c.fillStyle=top; rr(c,-tw/2-1,ty,tw+2,torsoH+legH*0.5,8); c.fill(); }
  c.fillStyle=top; rr(c,-tw/2,ty,tw,torsoH+4,8); c.fill();
  if(cfg.belly>0.04){ c.beginPath(); c.ellipse(0,ty+torsoH*0.68,tw/2+cfg.belly*11,torsoH*0.36+cfg.belly*5,0,0,TAU); c.fill(); }
  if(o==='suit'){
    c.fillStyle='#fff'; poly(c,[[-tw*0.24,ty],[tw*0.24,ty],[0,ty+torsoH*0.5]]); c.fill();
    c.fillStyle=shade(col,-30); poly(c,[[-tw*0.24,ty],[-tw*0.05,ty+torsoH*0.45],[-tw*0.14,ty+torsoH*0.5]]); c.fill();
    poly(c,[[tw*0.24,ty],[tw*0.05,ty+torsoH*0.45],[tw*0.14,ty+torsoH*0.5]]); c.fill();
    c.fillStyle='#b91c1c'; poly(c,[[-3,ty+2],[3,ty+2],[4,ty+torsoH*0.55],[0,ty+torsoH*0.63],[-4,ty+torsoH*0.55]]); c.fill();
    c.fillStyle=shade(col,-40); c.beginPath(); c.arc(2,ty+torsoH*0.72,1.5,0,TAU); c.arc(2,ty+torsoH*0.86,1.5,0,TAU); c.fill();
  } else if(o==='shirt'){
    c.fillStyle='#fff'; poly(c,[[-tw*0.22,ty],[tw*0.22,ty],[0,ty+10]]); c.fill();
    c.fillStyle='#1f2937'; poly(c,[[-3,ty+3],[3,ty+3],[4,ty+torsoH*0.58],[0,ty+torsoH*0.66],[-4,ty+torsoH*0.58]]); c.fill();
    c.strokeStyle='rgba(0,0,0,.25)'; c.lineWidth=1; c.strokeRect(tw*0.12,ty+torsoH*0.3,tw*0.22,tw*0.22);
  } else if(o==='shirt2'){
    c.fillStyle=SKIN; poly(c,[[-tw*0.12,ty-1],[tw*0.12,ty-1],[0,ty+8]]); c.fill();

const PATTERNS=[[0,500,1000,1500,2000,2250,2500,3000],[0,400,800,1200,1800,2100,2400,3000],[0,600,900,1200,1800,2400,2700,3000],[0,450,900,1350,1800,2025,2250,2700]];
const PERFECT=85, GOOD=175, LEAD=1800, TRAVEL=1500;

function startRhythm(){
  G.state='rhythm';
  const pat=rnd(PATTERNS);
  rh={start:performance.now()+LEAD,notes:pat.map(t=>({t,hit:false})),judge:'',judgeT:0,judgeCol:'#fff',lastNow:performance.now(),ended:false,kickT:0,shake:0,openT:performance.now(),hits:0,flyT:0,crackT:0,crackText:''};

function rhythmTap(){
  if(!rh||rh.ended||G.state!=='rhythm') return;
  const now=performance.now(); if(now-rh.openT<180) return;
  let best=null, bd=1e9;
  for(const n of rh.notes){ if(n.hit) continue; const dt=Math.abs(now-(rh.start+n.t)); if(dt<bd){ bd=dt; best=n; } }
  rh.kickT=now;
  if(best&&bd<=GOOD){
    best.hit=true; rh.hits++; rh.shake=now; shakeScreen(rh.hits); rh.crackT=now; rh.crackText=CRACKS[Math.min(rh.hits,CRACKS.length-1)];
    if(bd<=PERFECT){ rh.judge='PERFECT!'; rh.judgeCol='#ffd54a'; beep(880,0.1,'square',0.07); }
    else { rh.judge='GOOD'; rh.judgeCol='#8ff0b0'; beep(660,0.1,'square',0.06); }
    rh.judgeT=now;
    if(rh.notes.every(n=>n.hit)) endRhythm(true);
  } else { rh.judge=best?'MISS…':'헛발질!'; rh.judgeCol='#ff6b6b'; rh.judgeT=now; beep(140,0.25,'sawtooth',0.08); endRhythm(false); }
}
function endRhythm(ok){ rh.ended=true; if(ok) rh.flyT=performance.now()+220; const hits=rh.hits, total=rh.notes.length; setTimeout(()=>{ $('#rhythm').classList.remove('on'); showResult(ok,hits,total); },ok?1300:900); }
$('#rhythm').addEventListener('pointerdown',e=>{ e.preventDefault(); rhythmTap(); });
function rhythmFrame(now){
  const cv=$('#rcanvas'), c=fitCanvas(cv), w=cv.clientWidth, h=cv.clientHeight;
  c.clearRect(0,0,w,h);
  for(const n of rh.notes){ const at=rh.start+n.t; if(at>rh.lastNow&&at<=now) beep(330,0.04,'sine',0.025); if(!n.hit&&!rh.ended&&now>at+GOOD){ rh.judge='MISS…'; rh.judgeCol='#ff6b6b'; rh.judgeT=now; beep(140,0.25,'sawtooth',0.08); endRhythm(false); } }
  rh.lastNow=now;
  // 교수님 (흔들림 · 기울기 · 날아가기)
  const hits=rh.hits, amp=3+hits*1.6;
  const shk=rh.shake&&now-rh.shake<260?(1-(now-rh.shake)/260):0;
  const sx=Math.sin((now-rh.shake)/9)*amp*shk, sy=Math.cos((now-rh.shake)/7)*amp*0.6*shk;
  const ps=Math.min(2.1,(h-150)/(110*1.32+40)*0.95);
  let px=w*0.5+sx, py=h-128+sy, rot=-hits*0.03, fly=0;
  if(rh.flyT){ fly=clamp((now-rh.flyT)/650,0,1); px+=-fly*fly*(w*0.9+200); py-=fly*(h*0.85); rot+=fly*14; }
  const ok=rh.ended&&rh.notes.every(n=>n.hit);
  const mood=rh.ended?(ok?'dizzy':'angry'):'scared';
  const H=110*cfg.height, headD=34*cfg.headSize, bodyH=Math.max(44,H-headD), legH=bodyH*0.42;
  const bw={slim:0.78,normal:1,chubby:1.3,big:1.52}[cfg.body], lx=30*bw*0.28;
  c.save(); c.translate(px,py); c.rotate(rot); c.scale(ps,ps);
  drawProf(c,0,0,1,cfg,mood);
  // 정강이 금 가기
  const shx=lx, shy=-legH*0.4; c.lineCap='round';
  for(let i=0;i<hits;i++){ const a=i*2.4+0.6, L=4+i*1.6; c.beginPath(); c.moveTo(shx,shy); let x=shx,y=shy; for(let s=1;s<=3;s++){ x+=Math.cos(a+(s%2?0.5:-0.5))*L/3; y+=Math.sin(a+(s%2?0.5:-0.5))*L/3; c.lineTo(x,y); } c.strokeStyle='rgba(255,255,255,.85)'; c.lineWidth=2.2; c.stroke(); c.strokeStyle='rgba(30,15,8,.9)'; c.lineWidth=1.1; c.stroke(); }
  if(hits>=6){ c.fillStyle='#1a0d08'; c.beginPath(); c.moveTo(shx-7,shy-2); c.lineTo(shx+7,shy+1); c.lineTo(shx+7,shy+4); c.lineTo(shx-7,shy+2); c.closePath(); c.fill(); }
  c.restore();
  if(fly>0&&fly<1){ c.strokeStyle='rgba(255,255,255,.6)'; c.lineWidth=3; for(let i=0;i<6;i++){ c.beginPath(); c.moveTo(px+30+i*14,py-70+i*20); c.lineTo(px+110+i*14,py-30+i*20); c.stroke(); } c.fillStyle='#fff'; c.font=`900 30px ${KFONT}`; c.textAlign='center'; c.textBaseline='middle'; c.fillText('휘이이익!!',w/2,h*0.3); }
  if(rh.kickT&&now-rh.kickT<260){ const k=(now-rh.kickT)/260; c.save(); c.font='40px sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.translate(w*0.5+70-k*55,h-128-18*ps); c.rotate(-0.4+k*0.6); c.fillText('👟',0,0); c.restore(); if(rh.judge!=='MISS…'&&rh.judge!=='헛발질!'&&k<0.5){ c.font='30px sans-serif'; c.fillText('💥',w*0.5+lx*ps,h-128-legH*0.4*ps); } }
  if(rh.crackT&&now-rh.crackT<600){ const k=(now-rh.crackT)/600; c.save(); c.globalAlpha=1-k; c.fillStyle='#fff'; c.font=`900 ${26+k*10}px ${KFONT}`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(rh.crackText,w*0.5+70,h-128-legH*0.9*ps-k*30); c.restore(); }
  // 판정
  if(rh.judgeT&&now-rh.judgeT<700){ const k=(now-rh.judgeT)/700; c.save(); c.globalAlpha=1-k; c.fillStyle=rh.judgeCol; c.font=`900 ${34+8*(1-Math.min(1,k*4))}px ${KFONT}`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(rh.judge,w/2,40-k*20); c.restore(); }
  // 레인
  const ly=h-58, hitX=64, pxms=(w-hitX-28)/TRAVEL;
  c.fillStyle='rgba(0,0,0,.28)'; rr(c,14,ly-26,w-28,52,26); c.fill();
  c.strokeStyle='#8ff0b0'; c.lineWidth=3; c.beginPath(); c.arc(hitX,ly,21,0,TAU); c.stroke();
  c.fillStyle='rgba(143,240,176,.15)'; c.fill();
  c.font='26px sans-serif'; c.textAlign='center'; c.textBaseline='middle';
  for(const n of rh.notes){ if(n.hit) continue; const x=hitX+(rh.start+n.t-now)*pxms; if(x<-30||x>w+30) continue; c.fillText('👟',x,ly+1); }
  c.fillStyle='rgba(255,255,255,.75)'; c.font=`700 13px ${KFONT}`; c.textAlign='left';
  const left=Math.ceil((rh.start-now)/1000); c.fillText(now<rh.start?`준비… ${Math.max(1,left)}`:`${rh.hits} / ${rh.notes.length}`,18,ly-38);
}

/* ================= 결과 ================= */
let best=null; try{ best=parseFloat(localStorage.getItem('jonggang_best'))||null; }catch(_){}
let resMode='ok';
function showResult(ok,hits,total){
  G.state='result'; resMode=ok?'ok':'f';
  const name=cfg.name?cfg.name+' 교수님':'교수님';
  const t=G.elapsed;
  if(ok){
    let rec='';
    try{ if(best===null||t<best){ best=t; localStorage.setItem('jonggang_best',String(t)); rec=' · 신기록!'; } else rec=` · 최고 기록 ${best.toFixed(2)}초`; }catch(_){}
    $('#resTitle').textContent=SUBJECT.name+' 종강에 성공하셨습니다'; $('#resTitle').className='ok';
    $('#resSub').innerHTML=`종강까지 걸린 시간<b>${t.toFixed(2)}초</b>${name}이 종강을 선언했습니다${rec}`;
    $('#btnRetry').textContent='한 번 더 종강하기'; $('#btnRetry').className='big';
  } else {
    $('#resTitle').textContent='종강에 실패하고 F학점을 받으셨습니다'; $('#resTitle').className='f';
    $('#resSub').innerHTML=`박자를 놓쳤습니다 (${hits} / ${total})<b>F</b>${name}이 ${SUBJECT.name} F학점을 주셨습니다`;
    $('#btnRetry').textContent='재수강하기'; $('#btnRetry').className='big pen';
  }
  $('#result').classList.add('on'); drawResult();
  beep(ok?880:160,0.3,ok?'triangle':'sawtooth',0.07);
}
function drawResult(){
  if(G.state!=='result') return;
  const cv=$('#rescanvas'), c=fitCanvas(cv), w=cv.clientWidth, h=cv.clientHeight; c.clearRect(0,0,w,h);
  const ok=resMode==='ok', s=Math.min(2,(h-80)/(110*1.32+40)*0.9);
  drawProf(c,w/2,h-16,s,cfg,ok?'dizzy':'angry');
  const top=h-16-s*(110*cfg.height+(cfg.hair==='bun'||cfg.hair==='afro'?16:6));
  bubble(c,w/2,Math.max(48,top-6),ok?'아아악 종강이야 ㅠㅠ':'아악 에프(F)잖아!',17);
}
$('#btnRetry').addEventListener('click',()=>{ $('#result').classList.remove('on'); resetGame(); G.state='play'; beep(520,0.08,'sine',0.04); });
$('#btnCustom').addEventListener('click',()=>{ $('#result').classList.remove('on'); $('#game').classList.remove('on'); $('#custom').classList.add('on'); G.state='custom'; drawPreview(); });
$('#enterBtn').addEventListener('click',()=>{ $('#custom').classList.remove('on'); $('#subject').classList.add('on'); });
$('#backBtn').addEventListener('click',()=>{ $('#subject').classList.remove('on'); $('#custom').classList.add('on'); drawPreview(); });
$('#startBtn').addEventListener('click',()=>{ SUBJECT.week=12+Math.floor(Math.random()*4); $('#subject').classList.remove('on'); $('#game').classList.add('on'); resetGame(); G.state='play'; beep(520,0.08,'sine',0.04); });

/* ================= 루프 ================= */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(G.state==='play'){ update(dt); render(); }
  else if(G.state==='rhythm'){ G.elapsed+=dt; render(); rhythmFrame(now); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('resize',()=>{ drawPreview(); drawResult(); });
</script>
